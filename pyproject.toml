[build-system]
requires = ["uv_build>=0.8,<1.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = "."

[project]
name = "fastapi-template"
version = "0.1.0"
description = "FastAPI template scaffold for backend APIs."
readme = "README.md"
requires-python = ">=3.12,<3.14"
authors = [{ name = "FastAPI Template Maintainers" }]
dependencies = [
    "colorlog>=6.8,<7.0",
    "fastapi>=0.115,<1.0",
    "pydantic>=2.8,<3.0",
    "pydantic-settings>=2.4,<3.0",
    "scalar-fastapi>=1.8,<2.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.6,<1.0",
    "ty",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["app", "tests"]
exclude = []

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = [
    "app",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["app/**/*.py", "tests/**/*.py"]
exclude = [
    ".venv/**",
    "build/**",
    "dist/**",
    "__pycache__/**",
]

[tool.ty.rules]
possibly-unresolved-reference = "error"
unresolved-import = "error"

[tool.ty.terminal]
output-format = "full"
error-on-warning = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra"
