services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "app.main"]
    env_file:
      - .env.dev
    environment:
      ENV_FILE: .env.dev
    ports:
      - "1114:1114"
    volumes:
      - ./app:/app/app:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:1114/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
